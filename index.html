<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25334d">
  <meta name="color-scheme" content="light">
  <title>業界地図</title>
  <meta name="description" content="自分用の業界地図。業界ごとの企業規模・資本関係を図でざっくり見る。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="業界地図">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/css/style.css?v=20261126-ux">
  <link rel="stylesheet" href="assets/css/brand-families.css?v=20261126-ux">
  <script type="module" src="assets/js/main.js?v=20261126-ux"></script>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="./" aria-label="業界地図 トップ">
      <img src="assets/icons/icon.svg" alt="" width="26" height="26">
      <span>業界地図</span>
    </a>
    <button class="app-search" id="menuBtn" type="button" aria-label="業界・企業を探す" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false">
      <span><span class="app-search-prefix">業界・企業を</span>探す</span>
    </button>
    <div class="region" role="group" aria-label="表示する地域">
      <button type="button" data-region="jp" aria-pressed="true">日本</button>
      <button type="button" data-region="world" aria-pressed="false">世界</button>
    </div>
  </header>

  <nav class="tabs" id="sectorTabs" aria-label="業界"></nav>

  <main id="main" class="main">
    <section id="hero" class="hero"></section>
    <div id="viewSwitch" class="seg seg-views" role="tablist" aria-label="表示の切り替え"></div>
    <section id="view" class="view" role="tabpanel" tabindex="0" hidden></section>
    <footer class="foot">
      数値は各社の決算資料・報道をもとにした概算です。最新の情報は各社IRでご確認ください。
    </footer>
  </main>

  <aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle" role="dialog"></aside>

  <dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <h2 id="drawerTitle">業界・企業を探す</h2>
      <button class="icon-btn" type="button" id="drawerClose" aria-label="検索を閉じる" autofocus></button>
    </div>
    <label class="search">
      <input id="searchInput" type="search" aria-label="業界・企業・ブランド名" placeholder="業界・企業・ブランド名" autocomplete="off" enterkeyhint="search">
    </label>
    <p id="drawerStatus" class="sr-only" role="status"></p>
    <div id="drawerBody" class="drawer-body"></div>
  </dialog>

  <script>
    // HTMLファイルを直接開いた場合（file://）はデータを読み込めないので案内を出す
    if (location.protocol === 'file:') {
      document.getElementById('view').hidden = false;
      document.getElementById('view').innerHTML =
        '<div class="error"><b>データを表示できませんでした</b>HTMLファイルを直接開くとデータを読み込めません。' +
        'GitHub Pages で開くか、このフォルダで <code>python3 -m http.server</code> を実行して ' +
        '<code>http://localhost:8000</code> を開いてください。</div>';
    }
  </script>
</body>
</html>
